<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICD-O-4 Класифікатор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6fa;--surface:#fff;--border:#e2e6ef;--border2:#d0d6e4;
  --text:#111827;--sub:#4b5563;--muted:#9ca3af;
  --accent:#1d4ed8;--accent-bg:#eff4ff;--accent-border:#c7d9ff;--accent-muted:#93aff7;
  --green:#059669;--green-bg:#ecfdf5;
  --amber:#b45309;--amber-bg:#fffbeb;
  --red:#dc2626;--red-bg:#fef2f2;
  --purple:#7c3aed;
  --cyan:#0e7490;--cyan-bg:#ecfeff;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.04);
  --r:10px;--rs:6px;
}
html{font-size:15px}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}

header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;box-shadow:var(--shadow-sm)}
.hi{max-width:860px;margin:0 auto;padding:18px 24px 14px}
.br{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.bl{display:flex;align-items:center;gap:12px}
.bi{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bt{font-size:1.05rem;font-weight:600;color:var(--text);letter-spacing:-.01em}
.bs{font-size:.72rem;color:var(--muted);margin-top:1px}
.tp{font-size:.72rem;font-weight:600;color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-border);padding:4px 10px;border-radius:20px;white-space:nowrap}

.sw{position:relative}
.si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:flex}
#si{width:100%;background:var(--bg);border:1.5px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:'Inter',sans-serif;font-size:.9rem;padding:10px 44px 10px 40px;outline:none;transition:border-color .15s,background .15s,box-shadow .15s}
#si:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
#si::placeholder{color:var(--muted)}
.cb{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--border);border:none;color:var(--sub);cursor:pointer;width:22px;height:22px;border-radius:50%;display:none;align-items:center;justify-content:center;transition:background .15s}
.cb:hover{background:var(--border2)}
.cb.on{display:flex}

.mb{display:flex;align-items:center;justify-content:space-between;margin-top:10px;min-height:20px;flex-wrap:wrap;gap:8px}
.fbs{display:flex;gap:6px}
.fb{font-size:.72rem;font-weight:600;padding:4px 12px;border-radius:20px;border:1.5px solid var(--border2);background:none;color:var(--muted);cursor:pointer;transition:all .15s;letter-spacing:.02em;font-family:'Inter',sans-serif}
.fb:hover{border-color:var(--accent);color:var(--accent)}
.fb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fb.on:hover{background:#1a44c2}
.rc{font-size:.75rem;color:var(--muted)}
.rc strong{color:var(--accent);font-weight:600}
.kh{font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.kk{font-family:'IBM Plex Mono',monospace;background:var(--bg);border:1px solid var(--border2);border-radius:4px;padding:1px 5px;font-size:.65rem;color:var(--sub)}

main{max-width:860px;margin:0 auto;padding:20px 24px 60px}
#list{display:flex;flex-direction:column;gap:6px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm);transition:box-shadow .15s,border-color .15s,transform .1s;animation:fu .16s ease both;overflow:hidden}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--border2);transform:translateY(-1px)}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ci{display:flex;align-items:stretch}
.st{width:4px;flex-shrink:0}
.mal .st{background:var(--red)}.ben .st{background:var(--green)}.unc .st{background:#d97706}.ins .st{background:var(--purple)}.met .st{background:#0891b2}.oth .st{background:var(--border2)}
.cc{flex:1;padding:13px 14px 13px 16px;display:flex;align-items:flex-start;gap:14px;min-width:0}
.cb2{flex:1;min-width:0}
.cr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ch{font-family:'IBM Plex Mono',monospace;font-size:.75rem;font-weight:500;color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-border);padding:2px 8px;border-radius:4px;letter-spacing:.04em;white-space:nowrap}
.bb{font-size:.65rem;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:4px;text-transform:uppercase;white-space:nowrap}
.mal .bb{background:var(--red-bg);color:var(--red)}.ben .bb{background:var(--green-bg);color:var(--green)}.unc .bb{background:var(--amber-bg);color:var(--amber)}.ins .bb{background:#f5f3ff;color:var(--purple)}.met .bb{background:var(--cyan-bg);color:var(--cyan)}.oth .bb{display:none}
.dr{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.dr:last-child{margin-bottom:0}
.ld{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:7px}
.luk{background:#f59e0b}.len{background:var(--accent-muted)}
.dt{font-size:.875rem;line-height:1.5;color:var(--text);flex:1}
.dte{color:var(--sub);font-size:.825rem}
mark{background:#fef08a;color:#713f12;border-radius:2px;padding:0 1px}

.cpc{display:flex;flex-direction:column;gap:5px;flex-shrink:0;padding-top:1px}
.cpb{display:flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);color:var(--sub);font-family:'Inter',sans-serif;font-size:.72rem;font-weight:600;padding:5px 10px;cursor:pointer;white-space:nowrap;transition:all .14s;letter-spacing:.02em;line-height:1}
.cpb:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.cpb.ok{border-color:var(--green);color:var(--green);background:var(--green-bg)}

.empty{text-align:center;padding:64px 24px;color:var(--muted)}
.ei{width:48px;height:48px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--border2)}
.et{font-size:.9rem;font-weight:600;color:var(--sub);margin-bottom:4px}
.es{font-size:.8rem}

.ss{text-align:center;padding:48px 24px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:480px;margin:0 auto}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;text-align:left;box-shadow:var(--shadow-sm)}
.sn{font-family:'IBM Plex Mono',monospace;font-size:1.1rem;font-weight:500;color:var(--accent);margin-bottom:2px}
.sl{font-size:.72rem;color:var(--muted)}
.sh{font-size:.82rem;color:var(--muted);margin-top:20px}
.sh strong{color:var(--sub);font-weight:600}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:#111827;color:#fff;font-size:.78rem;font-weight:600;padding:9px 18px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;display:flex;align-items:center;gap:7px;letter-spacing:.01em;box-shadow:0 4px 16px rgba(0,0,0,.18)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:600px){.hi{padding:14px 16px 12px}main{padding:14px 16px 48px}.sg{grid-template-columns:repeat(2,1fr)}.kh{display:none}.bb{display:none}}
.unk9 .st{background:#be185d}.unk9 .bb{background:#fdf2f8;color:#be185d}
.fl{font-size:.65rem;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--amber-bg);color:var(--amber);border:1px solid #fde68a;cursor:help;white-space:nowrap}
.vf{font-size:.65rem;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--green-bg);color:var(--green);white-space:nowrap}
.more{display:block;margin:10px auto 0;font-family:'Inter',sans-serif;font-size:.78rem;font-weight:600;color:var(--accent);background:var(--surface);border:1px solid var(--accent-border);border-radius:var(--rs);padding:7px 16px;cursor:pointer}
.more:hover{background:var(--accent-bg)}
button:focus-visible,#si:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.card{animation:none}.card:hover{transform:none}}
</style>
</head>

const norm = s => s.toLowerCase()
  .replace(/[’ʼ`´‘]/g,"'").replace(/ё/g,'е')
  .replace(/[‐-―]/g,'-').replace(/\s+/g,' ').trim();

const BL={'0':'Доброякісна','1':'Невизначена','2':'In situ','3':'Злоякісна','6':'Метастаз','9':'Перв./метаст.?'};
const BC={'0':'ben','1':'unc','2':'ins','3':'mal','6':'met','9':'unk9'};

const DATA = RAW.map(([code,en,uk,v,fl])=>{
  const [m,b]=code.split('/');
  const code4=m.slice(0,4)+'/'+b;                       // ICD-O-3-style: 8140A/3 → 8140/3
  return {code,en,uk,v,fl,b,
    nc:norm(code), nen:norm(en), nuk:norm(uk),
    hay:norm(code+' '+code4+' '+m+b+' '+en+' '+uk)};      // m+b: пошук без слеша (814033)
});
const FLAGGED = DATA.filter(r=>r.fl.length).length;
const MAL = DATA.filter(r=>r.b==='3').length;
document.getElementById('tp').textContent = DATA.length.toLocaleString('uk')+' нозологій';
document.getElementById('fbFl').textContent = 'На перевірку · '+FLAGGED;

const escH = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escA = s => escH(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const escRe = s => s.replace(/[-.*+?^${}()|[\]\\]/g,'\\$&');
// apostrophe-insensitive highlight of every token
function hl(text,tokens){
  const t=escH(text); if(!tokens.length) return t;
  const re=new RegExp('('+tokens.slice().sort((a,b)=>b.length-a.length)
    .map(x=>escRe(escH(x)).replace(/'/g,"['’ʼ`´‘]").replace(/е/g,'[её]')).join('|')+')','gi');
  return t.replace(re,'<mark>$1</mark>');
}

const cpIco=`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>`;

function buildCard(r,i,tok){
  const cls=BC[r.b]||'oth', lbl=BL[r.b]||'';
  const ukT=`${r.uk} (ICD-O-4: ${r.code})`, enT=`${r.en} (ICD-O-4: ${r.code})`;
  const fl=r.fl.length?`<span class="fl" title="${escA(r.fl.join('\n'))}">⚠ ${r.fl.length>1?r.fl.length+' позн.':'позначка'}</span>`:'';
  const vf=r.v?`<span class="vf">✓ перевірено</span>`:'';
  return `<div class="card ${cls}" style="animation-delay:${Math.min(i*.012,.24)}s">
    <div class="ci"><div class="st"></div>
    <div class="cc"><div class="cb2">
      <div class="cr"><span class="ch">${hl(r.code,tok)}</span>${lbl?`<span class="bb">${lbl}</span>`:''}${vf}${fl}</div>
      <div class="dr"><span class="ld luk"></span><span class="dt">${hl(r.uk,tok)}</span></div>
      <div class="dr"><span class="ld len"></span><span class="dt dte">${hl(r.en,tok)}</span></div>
    </div><div class="cpc">
      <button class="cpb" data-t="${escA(ukT)}" data-l="УКР">${cpIco}УКР</button>
      <button class="cpb" data-t="${escA(enT)}" data-l="ENG">${cpIco}ENG</button>
    </div></div></div></div>`;
}

    <div class="sc"><div class="sn">${FLAGGED}</div><div class="sl">З позначками</div></div>
  </div>
  <p class="sh">Введіть <strong>код</strong> (80822/3, 8082/3, 808223) або <strong>слова діагнозу</strong> українською чи англійською — у будь-якому порядку</p></div>`;
}

// ranking: exact code → code prefix → term starts with query → phrase match → token match
function score(r,q){
  if(r.nc===q) return 0;
  if(r.nc.startsWith(q)) return 1;
  if(r.nuk.startsWith(q)||r.nen.startsWith(q)) return 2;
  if(r.nuk.includes(q)||r.nen.includes(q)) return 3;
  return 4;
}

let query='', onlyFl=false, limit=150;
const inp=document.getElementById('si'), clrBtn=document.getElementById('cb'),
      listEl=document.getElementById('list'), rcEl=document.getElementById('rc'),
      fbFl=document.getElementById('fbFl');

function render(){
  const q=norm(query), tok=q?q.split(' '):[];
  if(!q && !onlyFl){ listEl.innerHTML=startHTML(); rcEl.innerHTML='&nbsp;'; return; }
  let res=DATA;
  if(onlyFl) res=res.filter(r=>r.fl.length);
  if(tok.length){
    res=res.filter(r=>tok.every(t=>r.hay.includes(t)))
           .map(r=>[score(r,q),r]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  }
  if(!res.length){
    listEl.innerHTML=`<div class="empty"><div class="ei"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div><div class="et">Нічого не знайдено</div><div class="es">Скоротіть запит або перевірте код — пошук іде за всіма словами одночасно</div></div>`;
    rcEl.innerHTML='&nbsp;'; return;
  }
  const shown=res.slice(0,limit);
  rcEl.innerHTML=`Знайдено: <strong>${res.length.toLocaleString('uk')}</strong>${res.length>shown.length?' · показано '+shown.length:''}`;
  listEl.innerHTML=shown.map((r,i)=>buildCard(r,i,tok)).join('')+
    (res.length>shown.length?`<button class="more" id="more">Показати ще ${Math.min(150,res.length-shown.length)}</button>`:'');
}

listEl.addEventListener('click',e=>{
  if(e.target.closest('#more')){ limit+=150; render(); return; }
  const btn=e.target.closest('.cpb'); if(!btn) return;
  navigator.clipboard.writeText(btn.dataset.t).then(()=>{
    btn.classList.add('ok'); btn.innerHTML=okIco+btn.dataset.l; showToast();
    setTimeout(()=>{ btn.classList.remove('ok'); btn.innerHTML=cpIco+btn.dataset.l; },2000);
  });
});

let deb;
inp.addEventListener('input',()=>{
  query=inp.value; clrBtn.classList.toggle('on',query.trim().length>0); limit=150;
  clearTimeout(deb); deb=setTimeout(render,80);
});
const clear=()=>{ inp.value=''; query=''; limit=150; clrBtn.classList.remove('on'); render(); };
clrBtn.addEventListener('click',()=>{ clear(); inp.focus(); });
fbFl.addEventListener('click',()=>{ onlyFl=!onlyFl; fbFl.classList.toggle('on',onlyFl); limit=150; render(); });

let tt;
function showToast(){ const t=document.getElementById('toast'); t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1800); }
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); inp.focus(); inp.select(); }
  if(e.key==='Escape'&&document.activeElement===inp) clear();
});
render();
</script>
</body>
